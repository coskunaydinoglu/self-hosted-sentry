# Static symbol server for iOS / Android OS symbols in symsorter "unified" layout.
# Symbolicator fetches <debug_id[:2]>/<debug_id[2:]>/{debuginfo,executable} from here.
server {
	listen 80;
	root /usr/share/nginx/html;
	autoindex on;
	access_log off;
	# symsorter -zz writes zstd-compressed objects; Symbolicator detects that by magic bytes.
	default_type application/octet-stream;
	location = /health {
		return 200 "ok\n";
	}
}
